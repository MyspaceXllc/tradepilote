<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="web/src/styles.css" rel="stylesheet"/><title>TradePilot Advanced Preview</title></head><body>
<div class="app"><header class="topbar"><div class="brandlock"><div class="brand">TP</div><div><strong>TRADEPILOT</strong><span>MT5 REMOTE CONTROL</span></div></div><div class="connection live"><i></i>MT5 CONNECTED</div></header>
<main class="shell"><div class="tapFeedback">✓ CLOSE WINNERS PRESSED</div><section class="terminal">
<div class="marketHeader"><div class="instrument"><span>XAUUSD</span><strong>SELL • 0.01</strong></div><div class="quote"><small>ENTRY</small><strong>2,651.20</strong></div><div class="quote"><small>CURRENT</small><strong>2,653.60</strong></div><div class="pnl loser"><small>P / L</small><strong>−24.00</strong></div></div>
<div class="compactRow"><label><span>DEVICE</span><select><option>My MT5 Demo • online</option></select></label><label><span>SYMBOL</span><input value="XAUUSD"/></label></div>
<div class="lotControl"><button>−</button><div><small>LOT SIZE</small><strong>0.01</strong></div><button>+</button></div>
<div class="tradeActions"><button class="trade sell"><span>SELL</span><small>MARKET</small></button><button class="trade buy"><span>BUY</span><small>MARKET</small></button></div>
<button class="closePosition"><span>CLOSE POSITION</span><small>Closes all open positions</small></button><div class="result">Ready</div>
<details class="advanced" open=""><summary><div><strong>Advanced order</strong><span>SL, TP and pending limits</span></div><span>⌃</span></summary><div class="advancedBody"><div class="bulkClose"><p>Bulk close by current floating P/L</p><div><button class="closeWinners">CLOSE WINNERS</button><button class="closeLosers">CLOSE LOSERS</button></div></div><div class="fieldGrid"><label><span>STOP LOSS</span><input placeholder="Optional"/></label><label><span>TAKE PROFIT</span><input placeholder="Optional"/></label></div><div class="fieldGrid"><label><span>LIMIT SIDE</span><select><option>BUY LIMIT</option></select></label><label><span>LIMIT PRICE</span><input placeholder="Required"/></label></div><div class="advancedActions"><button class="cancel">CANCEL PENDING</button><button class="placeLimit">PLACE LIMIT</button></div></div></details></section>
<section class="utilityBar"><button>▦ PAIR DEVICE</button><button class="danger">◉ EMERGENCY</button><button>▣ LOCK</button></section></main></div></body></html>
